<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Imobiliária</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS próprio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

</head>

<body>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="login-card">

            <h1 class="text-center mb-3">
                Criar conta
            </h1>

            <p class="text-center text-muted">
                Cadastre-se para acessar o sistema
            </p>


            {% if erro %}

                <div
                    class="alert alert-danger text-center"
                    role="alert"
                >

                    <strong>
                        {{ erro }}
                    </strong>

                    <div class="mt-2">

                        Você será redirecionado para o login em
                        <span id="contador">3</span>
                        segundos.

                    </div>

                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('cadastro.cadastro') }}"
            >

                <!-- Nome -->

                <div class="mb-3">

                    <label
                        for="nome"
                        class="form-label"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <!-- E-mail -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <!-- Botão -->

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                    {% if erro %}disabled{% endif %}
                >
                    Continuar
                </button>

            </form>


            <!-- Login -->

            <div class="text-center mt-3">

                <span>
                    Já possui uma conta?
                </span>

                <a href="{{ url_for('login.login') }}">
                    Entrar
                </a>

            </div>

        </div>

    </main>


    <!-- JavaScript do cadastro -->

    <script
        src="{{ url_for('static', filename='js/cadastro.js') }}"
    ></script>

</body>

</html>
